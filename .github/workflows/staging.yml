name: Staging workload identity
on:
  workflow_dispatch:
    inputs:
      workload-identity-id:
        description: Disposable staging workload identity restricted to this repository and main
        required: true
        type: string
      version:
        description: Published CLI version
        default: '0.12.0'
        type: string
      sdk-version:
        description: Published SDK version
        default: '5.1.0'
        type: string
      node-source:
        description: Install Node from npm or the public SDK release archive
        default: npm
        type: choice
        options: [npm, release-archive]
      include-sdks:
        description: Validate both SDKs and token export after their releases are available
        default: true
        type: boolean
      auth-only:
        description: Validate exchange and auth-context only when the staging business database is unavailable
        default: false
        type: boolean
      expected-exchange:
        description: Expected result (denied proves an archived identity is rejected)
        default: success
        type: choice
        options: [success, denied]
permissions:
  contents: read
concurrency:
  group: staging-workload-identity
  cancel-in-progress: false
jobs:
  proof:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check GitHub subject and audience without printing a token
        run: |
          node --input-type=module - <<'JS'
          const url = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          url.searchParams.set('audience', 'https://api.staging.withflintpay.com');
          const r = await fetch(url, {headers:{Authorization:'Bearer '+process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}});
          const b = await r.json();
          if (!r.ok || !b.value) process.exit(1);
          const c = JSON.parse(Buffer.from(b.value.split('.')[1], 'base64url'));
          const immutable = `repo:${process.env.GITHUB_REPOSITORY_OWNER}@${process.env.GITHUB_REPOSITORY_OWNER_ID}/setup-flint@${process.env.GITHUB_REPOSITORY_ID}:ref:refs/heads/main`;
          const legacy = `repo:${process.env.GITHUB_REPOSITORY}:ref:refs/heads/main`;
          console.log(JSON.stringify({audienceMatches:c.aud==='https://api.staging.withflintpay.com',immutableSubject:c.sub===immutable,legacySubject:c.sub===legacy}));
          JS
      - id: setup
        uses: ./
        continue-on-error: ${{ inputs.expected-exchange == 'denied' }}
        with:
          version: ${{ inputs.version }}
          workload-identity-id: ${{ inputs.workload-identity-id }}
          api-base-url: https://api.staging.withflintpay.com
          scope: payments.payment_intents.read
      - name: Assert expected setup outcome
        env:
          EXPECTED: ${{ inputs.expected-exchange }}
          OUTCOME: ${{ steps.setup.outcome }}
        run: |
          if [ "$EXPECTED" = success ]; then test "$OUTCOME" = success; else test "$OUTCOME" = failure; fi
      - name: Verify an archived identity rejects a fresh exchange
        if: inputs.expected-exchange == 'denied'
        run: |
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          try {
            const url = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
            url.searchParams.set('audience', 'https://api.staging.withflintpay.com');
            const identity = await fetch(url, {
              headers:{Authorization:'Bearer '+process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN},
              redirect:'error', signal:AbortSignal.timeout(15000),
            });
            assert.equal(identity.status, 200);
            const {value} = await identity.json();
            assert.equal(typeof value, 'string');
            const response = await fetch('https://api.staging.withflintpay.com/v1/oauth/token', {
              method:'POST', redirect:'error', signal:AbortSignal.timeout(15000),
              body:new URLSearchParams({
                grant_type:'urn:ietf:params:oauth:grant-type:token-exchange',
                subject_token:value, subject_token_type:'urn:ietf:params:oauth:token-type:jwt',
                workload_identity_id:process.env.FLINT_WORKLOAD_IDENTITY_ID,
              }),
            });
            const result = await response.json();
            assert.equal(response.status, 400);
            assert.equal(result.error, 'invalid_grant');
            assert.equal(result.error_description, 'The workload identity is unavailable.');
            console.log('Archived workload identity: fresh exchange rejected with HTTP 400 invalid_grant');
          } catch { console.error('Archived identity denial proof failed'); process.exit(1); }
          JS
      - name: Verify CLI authentication and a scoped read without printing customer data
        if: inputs.expected-exchange == 'success'
        env:
          AUTH_ONLY: ${{ inputs.auth-only }}
        run: |
          for command in context read; do
            if [ "$command" = read ] && [ "$AUTH_ONLY" = true ]; then continue; fi
            if [ "$command" = context ]; then
              flint auth status --output json > "$RUNNER_TEMP/flint-$command.json" || true
            else
              flint payment-intents list --page-size 1 --external-reference-id setup-flint-credential-proof-empty --output json > "$RUNNER_TEMP/flint-$command.json" || true
            fi
          done
          node - <<'JS'
          const fs = require('node:fs');
          for (const name of process.env.AUTH_ONLY === 'true' ? ['context'] : ['context','read']) {
            const result = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/flint-' + name + '.json'));
            if (result.error) {
              const code = result.error.code;
              console.error(name + ' failed: ' + (/^[A-Z0-9_]+$/.test(code) ? code : 'unknown'));
              const requestId = result.error.request_id || result.request_id;
              if (typeof requestId === 'string' && /^[A-Za-z0-9_-]{1,100}$/.test(requestId)) console.error('request_id=' + requestId);
              process.exit(1);
            }
          }
          const c = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/flint-context.json'));
          if (c.data.auth_type !== 'workload_identity' || c.data.environment !== 'sandbox') process.exit(1);
          console.log(process.env.AUTH_ONLY === 'true' ? 'Released CLI: workload identity auth-context passed; business read excluded (staging database unavailable)' : 'Released CLI: workload identity auth-context and payment intents read passed');
          JS
      - name: Install released SDKs
        if: inputs.expected-exchange == 'success' && inputs.include-sdks
        env:
          SDK_VERSION: ${{ inputs.sdk-version }}
          NODE_SOURCE: ${{ inputs.node-source }}
        run: |
          if [ "$NODE_SOURCE" = release-archive ]; then
            node -e 'if (!/^\d+\.\d+\.\d+$/.test(process.env.SDK_VERSION)) process.exit(1)'
            npm install --ignore-scripts --no-audit --no-fund "https://github.com/flint-pay/flint-sdks/releases/download/v$SDK_VERSION/flintpay-node-$SDK_VERSION.tgz"
          else
            npm install --ignore-scripts --no-audit --no-fund "@flintpay/node@$SDK_VERSION"
          fi
          composer require --no-interaction --no-scripts --no-plugins "flintpay/flint:$SDK_VERSION"
      - name: Verify Node default credentials
        if: inputs.expected-exchange == 'success' && inputs.include-sdks
        env:
          AUTH_ONLY: ${{ inputs.auth-only }}
        run: |
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import { Client } from '@flintpay/node';
          try {
            assert.equal(process.env.FLINT_ACCESS_TOKEN || '', '');
            assert.equal(process.env.FLINT_API_KEY || '', '');
            const client = new Client({baseUrl:'https://api.staging.withflintpay.com'});
            const context = await client.developer.getAuthContext();
            assert.equal(context.auth_type, 'workload_identity');
            assert.equal(context.environment, 'sandbox');
            if (process.env.AUTH_ONLY !== 'true') await client.paymentIntents.list({page_size:1,external_reference_id:'setup-flint-credential-proof-empty'});
            console.log(process.env.AUTH_ONLY === 'true' ? 'Released Node SDK: automatic GitHub credentials and auth-context passed; business read excluded' : 'Released Node SDK: automatic GitHub credentials and scoped read passed');
          } catch { console.error('Node workload identity proof failed'); process.exit(1); }
          JS
      - name: Verify PHP default credentials
        if: inputs.expected-exchange == 'success' && inputs.include-sdks
        env:
          AUTH_ONLY: ${{ inputs.auth-only }}
        run: |
          php <<'PHP'
          <?php
          require 'vendor/autoload.php';
          try {
            if (getenv('FLINT_ACCESS_TOKEN') || getenv('FLINT_API_KEY')) throw new RuntimeException();
            $client = new \Flint\Client(new \Flint\ClientOptions(baseUrl:'https://api.staging.withflintpay.com'));
            $context = $client->developer->getAuthContext();
            if ($context->auth_type !== 'workload_identity' || $context->environment !== 'sandbox') throw new RuntimeException();
            if (getenv('AUTH_ONLY') !== 'true') $client->paymentIntents->list(['page_size'=>1,'external_reference_id'=>'setup-flint-credential-proof-empty']);
            echo getenv('AUTH_ONLY') === 'true' ? "Released PHP SDK: automatic GitHub credentials and auth-context passed; business read excluded\n" : "Released PHP SDK: automatic GitHub credentials and scoped read passed\n";
          } catch (Throwable $e) { fwrite(STDERR, "PHP workload identity proof failed\n"); exit(1); }
          PHP
      - name: Verify opt-in masked token export
        if: inputs.expected-exchange == 'success'
        uses: ./
        with:
          version: ${{ inputs.version }}
          workload-identity-id: ${{ inputs.workload-identity-id }}
          api-base-url: https://api.staging.withflintpay.com
          scope: payments.payment_intents.read
          export-access-token: 'true'
      - name: Assert access token was exported
        if: inputs.expected-exchange == 'success'
        run: node -e 'if(!process.env.FLINT_ACCESS_TOKEN?.startsWith("fwat_"))process.exit(1); console.log("Masked access token exported without logging its value")'
      - name: Reject wrong audience
        if: inputs.expected-exchange == 'success'
        id: wrong-audience
        uses: ./
        continue-on-error: true
        with:
          version: ${{ inputs.version }}
          workload-identity-id: ${{ inputs.workload-identity-id }}
          api-base-url: https://api.staging.withflintpay.com
          audience: https://wrong-audience.example.com
      - name: Assert wrong audience was rejected
        if: inputs.expected-exchange == 'success'
        env:
          OUTCOME: ${{ steps.wrong-audience.outcome }}
        run: test "$OUTCOME" = failure
  missing-permission:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: setup
        uses: ./
        continue-on-error: true
        with:
          version: ${{ inputs.version }}
          workload-identity-id: ${{ inputs.workload-identity-id }}
          api-base-url: https://api.staging.withflintpay.com
      - name: Assert missing id-token permission was rejected
        env:
          OUTCOME: ${{ steps.setup.outcome }}
        run: test "$OUTCOME" = failure
